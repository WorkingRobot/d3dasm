[package]
name = "dxbc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
smallvec = { version = "1", features = ["union"] }

[dependencies.dxbc]
path = ".."

# The `.d3dasm` text grammar (serialize/assemble) lives in d3dasm; the fuzzer
# exercises it against dxbc's encode/decode.
[dependencies.d3dasm]
path = "../../d3dasm"

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

# Keep the fuzz crate out of the parent workspace (cargo-fuzz convention).
[workspace]
